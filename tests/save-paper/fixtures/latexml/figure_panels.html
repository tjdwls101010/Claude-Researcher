<figcaption class="ltx_caption"><span class="ltx_tag ltx_tag_figure"><span class="ltx_text" id="S3.F5.7" style="font-size:90%;">Figure 5</span>: </span><span class="ltx_text ltx_font_bold" id="S3.F5.8" style="font-size:90%;">Bayesian teaching generalizes outside the task used for fine-tuning.<span class="ltx_text ltx_font_medium" id="S3.F5.8.1"> </span>(a)<span class="ltx_text ltx_font_medium" id="S3.F5.8.2"> Final-round accuracy gain in fine-tuned models compared to the original LLM when varying task complexity (here the number of features is a proxy for task complexity). </span>(b)<span class="ltx_text ltx_font_medium" id="S3.F5.8.3"> Final-round accuracy for LLMs on the hotel recommendation task, which was not seen during fine-tuning. We show the normative Bayesian Assistant’s performance with brown dashed lines. </span>(c)<span class="ltx_text ltx_font_medium" id="S3.F5.8.4"> Final-round accuracy for LLMs on the web shopping domain, also unseen during fine-tuning. The green dashed line indicates the performance of the LLM when it is fine-tuned directly on web shopping data, such that no domain generalization is necessary. Error bars indicate the standard errors over three training runs (for web shopping) and additionally three random seeds (for flight recommendation and hotel recommendation).</span></span></figcaption>
</figure></article></div></body></html>
