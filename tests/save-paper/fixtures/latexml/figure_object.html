<!DOCTYPE html><html><body><div class="ltx_page_main"><article class="ltx_document"><figure class="ltx_figure" id="S2.F2"><object class="ltx_graphics ltx_centering ltx_img_landscape" data="2503.17523v3/fig2_eval_results.svg" height="127" id="S2.F2.g1" style="aspect-ratio:476/127;" type="image/svg+xml" width="476"></object>
<figcaption class="ltx_caption ltx_centering"><span class="ltx_tag ltx_tag_figure"><span class="ltx_text" id="S2.F2.4" style="font-size:90%;">Figure 2</span>: </span><span class="ltx_text ltx_font_bold" id="S2.F2.5" style="font-size:90%;">LLMs show limited or no improvement over multiple interactions with the user.<span class="ltx_text ltx_font_medium" id="S2.F2.5.1"> We show accuracy after the first round and final (fifth) round. We compare off-the-shelf LLMs from different model families to human participants and the Bayesian Assistant. For human participants, we only evaluate on a subset of 48 out of our 624 simulated users. The LLMs perform considerably worse than the Bayesian Assistant. Human participants demonstrate a larger improvement than most LLMs as they receive more information, but they still fall short of the accuracy that characterizes the normative Bayesian strategy. For the human study, the error bars show the averaged standard error across participants; for models, they show the standard error across the three sets of interactions with each of the 624 users.</span></span></figcaption>
</figure></article></div></body></html>
